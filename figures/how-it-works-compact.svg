<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="268" viewBox="0 0 1240 268" role="img" aria-labelledby="title description">
  <title id="title">TriplePeek workflow</title>
  <desc id="description">A CSV catalog is indexed in PostgreSQL for local search. A selected IRI is passed to Describe or a custom query button in TriplePeek. The SPARQL endpoint accesses RDF data and can delegate federated queries to other endpoints through SERVICE. All labels are editable text.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#426683"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00877c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#122d48}
      .heading{font-size:22px;font-weight:700;fill:white}
      .label{font-size:19px;font-weight:700}
      .detail{font-size:16px;fill:#456078}
      .node{fill:white;stroke:#bed3e3;stroke-width:1.5}
      .flow{fill:none;stroke:#426683;stroke-width:2;marker-end:url(#arrow)}
      .remote{fill:none;stroke:#00877c;stroke-width:2;marker-end:url(#teal-arrow)}
    </style>
  </defs>
  <rect width="1240" height="268" fill="white"/>
  <g id="search-layer">
    <rect x="8" y="8" width="488" height="252" rx="12" fill="#eaf2f8"/>
    <path d="M20 8H484Q496 8 496 20V56H8V20Q8 8 20 8Z" fill="#084678"/>
    <text class="heading" x="252" y="39" text-anchor="middle">Local search</text>
    <rect class="node" x="24" y="115" width="108" height="82" rx="9"/>
    <text class="label" x="78" y="148" text-anchor="middle">Catalog</text>
    <text class="detail" x="78" y="174" text-anchor="middle">CSV</text>
    <path class="flow" d="M132 156H163"/>
    <rect class="node" x="164" y="115" width="160" height="82" rx="9"/>
    <text class="label" x="244" y="148" text-anchor="middle">PostgreSQL</text>
    <text class="detail" x="244" y="174" text-anchor="middle">Index + search</text>
    <path class="flow" d="M324 156H355"/>
    <rect class="node" x="356" y="115" width="124" height="82" rx="9"/>
    <text class="label" x="418" y="148" text-anchor="middle">Selected</text>
    <text class="label" x="418" y="174" text-anchor="middle">IRI</text>
  </g>
  <g id="query-actions">
    <rect x="508" y="8" width="280" height="252" rx="12" fill="#e6f3ff"/>
    <path d="M520 8H776Q788 8 788 20V56H508V20Q508 8 520 8Z" fill="#007ade"/>
    <text class="heading" x="648" y="39" text-anchor="middle">TriplePeek</text>
    <path class="flow" d="M480 156H527V116H548"/>
    <path class="flow" d="M527 156V202H548"/>
    <rect class="node" x="550" y="86" width="202" height="60" rx="9"/>
    <text class="label" x="651" y="123" text-anchor="middle">Describe</text>
    <rect class="node" x="550" y="170" width="202" height="64" rx="9"/>
    <text class="label" x="651" y="197" text-anchor="middle">Custom query</text>
    <text class="detail" x="651" y="220" text-anchor="middle">buttons</text>
  </g>
  <g id="sparql-access">
    <rect x="800" y="8" width="432" height="252" rx="12" fill="#e7f5f0"/>
    <path d="M812 8H1220Q1232 8 1232 20V56H800V20Q800 8 812 8Z" fill="#008b80"/>
    <text class="heading" x="1016" y="39" text-anchor="middle">SPARQL execution</text>
    <path d="M752 116H774V156M752 202H774V156" fill="none" stroke="#426683" stroke-width="2"/>
    <path class="flow" d="M774 156H818"/>
    <rect class="node" x="820" y="115" width="140" height="82" rx="9"/>
    <text class="label" x="890" y="148" text-anchor="middle">SPARQL</text>
    <text class="label" x="890" y="174" text-anchor="middle">endpoint</text>
    <path class="remote" d="M960 156H981V111H1034"/>
    <rect class="node" x="1036" y="83" width="178" height="56" rx="9"/>
    <text class="label" x="1125" y="118" text-anchor="middle">RDF data</text>
    <path class="remote" d="M960 156H981V213H1034" stroke-dasharray="5 4"/>
    <text class="detail" x="1093" y="175" text-anchor="middle">SERVICE (optional)</text>
    <rect class="node" x="1036" y="187" width="178" height="52" rx="9"/>
    <text class="label" x="1125" y="220" text-anchor="middle">Other endpoints</text>
  </g>
</svg>
